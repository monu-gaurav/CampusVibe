name: Android pilot APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pilot-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - name: Verify email entry and build signed pilot
        working-directory: mobile
        run: |
          flutter pub get
          flutter test --no-pub
          flutter build apk --no-pub --profile --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: CampusVibe-Email-Pilot
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk
          if-no-files-found: error
