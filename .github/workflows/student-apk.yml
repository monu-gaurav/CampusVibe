name: Build CampusVibe student APK
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Public HTTPS CampusVibe backend origin
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - name: Validate pilot
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          u=urllib.parse.urlsplit(os.environ['API_ORIGIN'])
          if u.scheme!='https' or not u.hostname or u.username or u.password or u.query or u.fragment or u.path not in ('','/'):
              raise SystemExit('Supply the public HTTPS origin')
          url=u.geturl().rstrip('/')+'/mobile/config'
          with urllib.request.urlopen(url,timeout=90) as r: config=json.load(r)
          if config.get('app')!='CampusVibe' or config.get('version')!=3:
              raise SystemExit('CampusVibe API configuration check failed')
          PY
      - name: Test and sign APK
        working-directory: mobile
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
          SIGNING_FILE: ${{ secrets.CAMPUS_KEYSTORE_B64 }}
          CAMPUS_STORE_PASSWORD: ${{ secrets.CAMPUS_STORE_PASSWORD }}
          CAMPUS_KEY_PASSWORD: ${{ secrets.CAMPUS_KEY_PASSWORD }}
          CAMPUS_KEY_ALIAS: ${{ secrets.CAMPUS_KEY_ALIAS }}
        run: |
          set -eu
          export CAMPUS_KEYSTORE="$RUNNER_TEMP/campus-upload.jks"
          test -n "$SIGNING_FILE" || { echo "Configure the owner's signing key"; exit 1; }
          umask 077
          printf '%s' "$SIGNING_FILE" | base64 -d > "$CAMPUS_KEYSTORE"
          trap 'rm -f "$CAMPUS_KEYSTORE"' EXIT
          flutter pub get
          flutter test --no-pub
          flutter build apk --release --dart-define="API_BASE_URL=$API_ORIGIN" --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: CampusVibe-Student-APK
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
