<!doctype html><html lang="en"><meta charset="utf-8"><title>CampusVibe verification</title><style>body{background:#fff8f0;color:#352044;max-width:760px;margin:3rem auto;font:18px system-ui}input,button{padding:10px;margin:5px}article{background:white;padding:15px;margin:10px}</style><h1>College verification</h1><p>Confirm enrollment with the institution. Approve adult eligibility only after independently checking date of birth.</p><input type="password" id="token" placeholder="Moderator token"><button id="refresh">Review requests</button><p id="statusMsg"></p><main id="queue"></main><script>
async function api(path,body){let r=await fetch('/moderation/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.json()).detail);return r.json()}
async function load(){queue.replaceChildren();try{let rows=await api('queue');statusMsg.textContent=rows.length+' students';for(let u of rows){let el=document.createElement('article');el.append(document.createTextNode(u.name+' · '+u.college+' · '+u.dob+' · '+(u.college_ok?'Verified':'Pending')));for(let adult of [false,true]){let b=document.createElement('button');b.textContent=adult?'Approve enrollment and 18+':'Approve enrollment only';b.onclick=async()=>{if(confirm(b.textContent+'?'))try{await api('verify/'+u.id,{adult_verified:adult});load()}catch(e){statusMsg.textContent=e.message}};el.append(b)}queue.append(el)}}catch(e){statusMsg.textContent=e.message}}refresh.onclick=load;
</script></html>
